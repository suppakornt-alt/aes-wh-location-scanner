<!DOCTYPE html>
<html lang="th" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AES's Warehouse · เลือกทีม</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="chooser-body">

  <main class="chooser-wrap">
    <div class="chooser-brand">
      <span class="brand-mark">
        <svg class="ic" viewBox="0 0 24 24"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3zM12 12l8-4.5M12 12v9M12 12L4 7.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/></svg>
      </span>
      <div>
        <div class="brand-name">AES Warehouse</div>
        <div class="brand-sub">ระบบจัดการพิกัดคลังสินค้า</div>
      </div>
    </div>

    <h1 class="chooser-title">เลือกทีมของคุณ</h1>
    <p class="chooser-sub">แตะที่การ์ดเพื่อเข้าสู่หน้าจอของทีม</p>

    <div class="chooser-grid">

      <!-- Team 1: Pickers (forklift) -->
      <a class="team-card team-picker" href="picker.html">
        <span class="team-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 3v16M2 17h4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M8 17v-6h8l2 3v3H8z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
            <path d="M11 11V6h5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="10" cy="19" r="1.8" fill="none" stroke="currentColor" stroke-width="1.8"/>
            <circle cx="17" cy="19" r="1.8" fill="none" stroke="currentColor" stroke-width="1.8"/>
          </svg>
        </span>
        <span class="team-name">ทีมจัดของ</span>
        <span class="team-desc">สแกน Lot · เช็คพิกัด · หยิบสินค้า</span>
      </a>

      <!-- Team 2: Warehouse office (building) -->
      <a class="team-card team-office" href="office.html">
        <span class="team-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 21h18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            <path d="M5 21V4a1 1 0 0 1 1-1h8a1 1 0 0 1 1 1v17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
            <path d="M15 9h3a1 1 0 0 1 1 1v11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
            <path d="M8 7h4M8 11h4M8 15h4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </span>
        <span class="team-name">ทีมออฟฟิศโกดัง</span>
        <span class="team-desc">สร้างใบสั่งหยิบ · ส่งให้ทีมจัดของ</span>
      </a>

    </div>
  </main>

</body>
</html>
