<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barcode & QR Scanner - Inventory UI</title>
  <script src="https://unpkg.com/@zxing/library@latest"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      text-align: center;
      margin: 0;
      padding: 1.5rem;
      background: #f8fafc;
      color: #1e293b;
    }
    .scanner-container {
      position: relative;
      max-width: 480px;
      margin: 1rem auto;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
    }
    video {
      width: 100%;
      height: 320px;
      object-fit: cover;
      display: block;
    }
    .overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 70%;
      height: 45%;
      border: 2px dashed rgba(255, 255, 255, 0.8);
      border-radius: 8px;
      pointer-events: none;
    }
    .card {
      max-width: 480px;
      margin: 1rem auto;
      padding: 1rem;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      text-align: left;
    }
    .sku-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: #0284c7;
      word-break: break-all;
    }
    button.primary-btn {
      padding: 10px 24px;
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      background: #0284c7;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    button.primary-btn:active { background: #0369a1; }

    /* Inventory Locations Styling */
    .location-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #e2e8f0;
    }
    .btn-group { display: flex; gap: 6px; }
    .btn-action {
      padding: 6px 12px;
      font-size: 0.85rem;
      border-radius: 6px;
      border: none;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-add { background: #16a34a; }
    .btn-pull { background: #dc2626; }
    .btn-move { background: #d97706; }
  </style>
</head>
<body>

  <h2>Scan Barcode & QR Code</h2>
  <button id="toggle-btn" class="primary-btn">Start Camera</button>

  <div class="scanner-container">
    <video id="video" autoplay playsinline muted></video>
    <div class="overlay"></div>
  </div>

  <div class="card">
    <div><strong>Scanned Data:</strong></div>
    <div class="sku-title" id="result-text">Waiting to scan...</div>
    <div style="margin-top: 0.25rem; color: #64748b; font-size: 0.9rem;">
      Format: <span id="result-format">-</span>
    </div>
  </div>

  <!-- Inventory Lookup Card -->
  <div class="card" id="inventory-card" style="display: none;">
    <div style="font-size: 0.8rem; color: #64748b; font-weight: 600;">PRODUCT DETAILS</div>
    <div id="product-name" style="font-size: 1.1rem; font-weight: 700; margin-bottom: 1rem; color: #0f172a;">-</div>

    <div style="font-size: 0.8rem; color: #64748b; font-weight: 600; margin-bottom: 0.5rem;">LOCATIONS & STOCK</div>
    <div id="locations-list"></div>
  </div>

  <script>
    const codeReader = new ZXing.BrowserMultiFormatReader();
    const resultText = document.getElementById('result-text');
    const resultFormat = document.getElementById('result-format');
    const toggleBtn = document.getElementById('toggle-btn');
    const inventoryCard = document.getElementById('inventory-card');
    const productName = document.getElementById('product-name');
    const locationsList = document.getElementById('locations-list');

    let isScanning = false;
    let lastScannedCode = null;

    // Database Lookup Table
    const mockDB = {
      "8850123456789": {
        name: "Industrial Bearing Pack 10mm",
        locations: [
          { code: "A-01-02", qty: 45 },
          { code: "B-04-12", qty: 12 }
        ]
      },
      "123456789012": {
        name: "Hex Bolt M8 x 50mm",
        locations: [{ code: "C-02-01", qty: 150 }]
      }
    };

    toggleBtn.addEventListener('click', async () => {
      if (isScanning) {
        codeReader.reset();
        isScanning = false;
        toggleBtn.textContent = 'Start Camera';
        return;
      }

      try {
        isScanning = true;
        toggleBtn.textContent = 'Stop Camera';
        lastScannedCode = null;

        // Original working camera initialization call
        await codeReader.decodeFromInputVideoDevice(
          undefined, // auto-select environment camera
          'video',
          (result, err) => {
            if (result) {
              const code = result.getText();
              resultText.textContent = code;
              resultFormat.textContent = result.getBarcodeFormat();
              
              if (navigator.vibrate) navigator.vibrate(100);
              
              handleInventoryLookup(code);
            }
          }
        );
      } catch (err) {
        alert('Could not start camera: ' + err.message);
        isScanning = false;
        toggleBtn.textContent = 'Start Camera';
      }
    });

    function handleInventoryLookup(code) {
      if (code === lastScannedCode) return;
      lastScannedCode = code;

      const data = mockDB[code] || {
        name: "Unknown Product (New SKU)",
        locations: [{ code: "RECEIVING-BAY", qty: 0 }]
      };

      productName.textContent = data.name;
      renderLocations(data.locations);
      inventoryCard.style.display = 'block';
    }

    function renderLocations(locations) {
      locationsList.innerHTML = locations.map(loc => `
        <div class="location-row">
          <div>
            <strong style="color: #1e293b;">${loc.code}</strong>
            <span style="color: #64748b; font-size: 0.9rem; margin-left: 8px;">Qty: ${loc.qty}</span>
          </div>
          <div class="btn-group">
            <button class="btn-action btn-add" onclick="alert('Added stock to ${loc.code}')">+</button>
            <button class="btn-action btn-pull" onclick="alert('Pulled stock from ${loc.code}')">-</button>
            <button class="btn-action btn-move" onclick="alert('Moving stock from ${loc.code}')">Move</button>
          </div>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
