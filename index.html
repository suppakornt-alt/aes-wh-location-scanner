<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barcode & QR Scanner</title>
  <script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.0/umd/index.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; text-align: center; margin: 0; padding: 1.5rem; background: #f8fafc; color: #1e293b; }
    .scanner { position: relative; max-width: 480px; margin: 1rem auto; border-radius: 12px; overflow: hidden; background: #000; }
    video { width: 100%; height: 320px; object-fit: cover; display: block; }
    .overlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 80%; height: 40%; border: 2px dashed rgba(255,255,255,.85); border-radius: 8px; pointer-events: none; }
    .card { max-width: 480px; margin: 1rem auto; padding: 1rem; background: #fff; border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,.08); }
    #result { font-size: 1.6rem; font-weight: 700; color: #0284c7; word-break: break-all; margin: .5rem 0; }
    button { padding: 10px 24px; font-size: 1rem; font-weight: 600; color: #fff; background: #0284c7; border: 0; border-radius: 8px; cursor: pointer; }
    #copy-btn { background: #64748b; padding: 6px 14px; font-size: .9rem; }
    #status { color: #64748b; font-size: .9rem; min-height: 1.2rem; }
    #warn { color: #b91c1c; font-size: .95rem; margin: .5rem auto; max-width: 480px; }
  </style>
</head>
<body>
  <h2>Scan Barcode & QR Code</h2>
  <div id="warn"></div>
  <button id="toggle-btn">Start Camera</button>
  <div id="status"></div>

  <div class="scanner">
    <video id="video" playsinline muted></video>
    <div class="overlay"></div>
  </div>

  <div class="card">
    <strong>Scanned number:</strong>
    <div id="result">Waiting to scan...</div>
    <div style="color:#64748b;font-size:.9rem">Format: <span id="format">-</span></div>
    <button id="copy-btn" style="margin-top:.6rem">Copy</button>
  </div>

  <script>
    const video = document.getElementById('video');
    const toggleBtn = document.getElementById('toggle-btn');
    const statusEl = document.getElementById('status');
    const resultEl = document.getElementById('result');
    const formatEl = document.getElementById('format');
    const warnEl = document.getElementById('warn');

    let stream = null;
    let running = false;
    let timerId = null;

    // Warn if opened inside an app that blocks the camera
    if (/Line\/|FBAN|FBAV|Instagram|MicroMessenger/i.test(navigator.userAgent)) {
      warnEl.textContent = 'This looks like an in-app browser (LINE/Facebook/etc). Camera may be blocked. Please open this link in Chrome or Safari.';
    }

    // Called every time a code is read. Put your product lookup here later.
    function onCode(code, format) {
      resultEl.textContent = code;
      formatEl.textContent = format;
      if (navigator.vibrate) navigator.vibrate(100);
    }

    async function start() {
      if (!window.isSecureContext || !navigator.mediaDevices?.getUserMedia) {
        statusEl.textContent = 'Camera needs HTTPS. Open the https:// github.io link, not a file.';
        return;
      }
      try {
        statusEl.textContent = 'Opening camera...';
        stream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: {
            facingMode: { ideal: 'environment' },
            width: { ideal: 1280 },
            height: { ideal: 720 }
          }
        });
        video.srcObject = stream;
        await video.play();

        running = true;
        toggleBtn.textContent = 'Stop Camera';
        statusEl.textContent = 'Point at a barcode...';

        if ('BarcodeDetector' in window) {
          startNativeLoop();
        } else {
          startZxingLoop();
        }
      } catch (err) {
        statusEl.textContent = 'Camera error: ' + err.name + ' - ' + err.message;
        stop();
      }
    }

    function stop() {
      running = false;
      clearTimeout(timerId);
      if (stream) {
        stream.getTracks().forEach(t => t.stop());
        stream = null;
      }
      video.srcObject = null;
      toggleBtn.textContent = 'Start Camera';
    }

    // Option A: the phone's built-in scanner (Chrome on Android)
    async function startNativeLoop() {
      const detector = new BarcodeDetector();
      const tick = async () => {
        if (!running) return;
        try {
          const found = await detector.detect(video);
          if (found.length > 0) onCode(found[0].rawValue, found[0].format);
        } catch (e) { /* ignore single-frame errors */ }
        timerId = setTimeout(tick, 120);
      };
      tick();
    }

    // Option B: ZXing fallback (iPhone, Firefox, etc.)
    function startZxingLoop() {
      const hints = new Map();
      hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [
        ZXing.BarcodeFormat.EAN_13, ZXing.BarcodeFormat.EAN_8,
        ZXing.BarcodeFormat.UPC_A, ZXing.BarcodeFormat.UPC_E,
        ZXing.BarcodeFormat.CODE_128, ZXing.BarcodeFormat.CODE_39,
        ZXing.BarcodeFormat.ITF, ZXing.BarcodeFormat.QR_CODE
      ]);
      hints.set(ZXing.DecodeHintType.TRY_HARDER, true);

      const reader = new ZXing.MultiFormatReader();
      reader.setHints(hints);

      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d', { willReadFrequently: true });

      const tick = () => {
        if (!running) return;
        if (video.videoWidth > 0) {
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          try {
            const source = new ZXing.HTMLCanvasElementLuminanceSource(canvas);
            const bitmap = new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(source));
            const result = reader.decode(bitmap);
            onCode(result.getText(), ZXing.BarcodeFormat[result.getBarcodeFormat()]);
          } catch (e) { /* nothing found in this frame, keep trying */ }
        }
        timerId = setTimeout(tick, 150);
      };
      tick();
    }

    toggleBtn.addEventListener('click', () => (running ? stop() : start()));

    document.getElementById('copy-btn').addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(resultEl.textContent); statusEl.textContent = 'Copied'; }
      catch { statusEl.textContent = 'Copy not allowed here'; }
    });
  </script>
</body>
</html>
