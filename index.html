<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fast Web Inventory Scanner</title>
  <script src="https://unpkg.com/@zxing/library@latest"></script>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; padding: 1rem; background: #0f172a; color: #f8fafc; text-align: center; }

    .scanner-card {
      position: relative;
      max-width: 480px;
      margin: 0 auto;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
      min-height: 260px;
    }
    
    video {
      width: 100%;
      height: 280px;
      object-fit: contain;
      display: block;
    }

    .viewfinder {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 80%;
      height: 45%;
      border: 2px dashed #38bdf8;
      border-radius: 8px;
      pointer-events: none;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.4);
    }

    .controls { margin: 1rem 0; }
    
    button {
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      background: #0284c7;
      color: #fff;
    }
    button:active { background: #0369a1; }

    .panel {
      max-width: 480px;
      margin: 1rem auto;
      padding: 1rem;
      background: #1e293b;
      border-radius: 10px;
      text-align: left;
      border: 1px solid #334155;
    }
    
    .sku-title { font-size: 1.3rem; font-weight: 700; color: #38bdf8; word-break: break-all; }
    
    .location-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #334155;
    }

    .btn-group { display: flex; gap: 6px; }
    .btn-sm { padding: 6px 12px; font-size: 0.85rem; border-radius: 6px; color: white; border: none; cursor: pointer; }
    .btn-add { background: #16a34a; }
    .btn-pull { background: #dc2626; }
    .btn-move { background: #d97706; }
  </style>
</head>
<body>

  <h2>Inventory Scanner</h2>

  <div class="scanner-card">
    <video id="video" autoplay playsinline muted></video>
    <div class="viewfinder"></div>
  </div>

  <div class="controls">
    <button id="toggle-btn">Start Camera</button>
  </div>

  <!-- Inventory Result UI -->
  <div class="panel" id="inventory-panel" style="display:none;">
    <div style="font-size: 0.8rem; color: #94a3b8;">SCANNED SKU</div>
    <div class="sku-title" id="sku-val">-</div>
    <div id="product-name" style="margin-bottom: 1rem; color: #cbd5e1; margin-top: 4px;">-</div>

    <div style="font-weight: 600; margin-bottom: 0.5rem; color: #94a3b8; font-size: 0.85rem;">LOCATIONS & STOCK</div>
    <div id="locations-list"></div>
  </div>

  <script>
    const video = document.getElementById('video');
    const toggleBtn = document.getElementById('toggle-btn');
    const inventoryPanel = document.getElementById('inventory-panel');
    const skuVal = document.getElementById('sku-val');
    const productName = document.getElementById('product-name');
    const locationsList = document.getElementById('locations-list');

    let isScanning = false;
    let codeReader = null;
    let nativeDetector = null;
    let nativeStream = null;
    let animFrameId = null;
    let lastCode = null;

    // Database Lookup Table
    const mockDB = {
      "8850123456789": {
        name: "Industrial Bearing Pack 10mm",
        locations: [
          { code: "A-01-02", qty: 45 },
          { code: "B-04-12", qty: 12 }
        ]
      },
      "123456789012": {
        name: "Hex Bolt M8 x 50mm",
        locations: [{ code: "C-02-01", qty: 150 }]
      }
    };

    async function initScanner() {
      // 1. Try Native Hardware API (Android Chrome / iOS 17 Safari)
      if ('BarcodeDetector' in window) {
        try {
          const formats = await BarcodeDetector.getSupportedFormats();
          nativeDetector = new BarcodeDetector({ formats });
          return;
        } catch (e) {}
      }

      // 2. Fallback to ZXing engine
      if (window.ZXing) {
        const hints = new Map();
        hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [
          ZXing.BarcodeFormat.QR_CODE,
          ZXing.BarcodeFormat.EAN_13,
          ZXing.BarcodeFormat.CODE_128,
          ZXing.BarcodeFormat.UPC_A
        ]);
        hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
        codeReader = new ZXing.BrowserMultiFormatReader(hints);
      }
    }

    async function startCamera() {
      const constraints = {
        video: { facingMode: { ideal: 'environment' } }
      };

      if (nativeDetector) {
        // Run via Native Hardware Stream Loop
        nativeStream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = nativeStream;
        await video.play();
        scanNativeLoop();
      } else if (codeReader) {
        // Run via ZXing Stream Engine
        await codeReader.decodeFromConstraints(
          constraints,
          'video',
          (result, err) => {
            if (result) handleSuccess(result.getText());
          }
        );
      } else {
        alert('Scanner engine failed to initialize.');
      }
    }

    async function scanNativeLoop() {
      if (!isScanning) return;
      try {
        if (video.readyState === video.HAVE_ENOUGH_DATA) {
          const codes = await nativeDetector.detect(video);
          if (codes.length > 0) {
            handleSuccess(codes[0].rawValue);
          }
        }
      } catch (e) {}
      animFrameId = requestAnimationFrame(scanNativeLoop);
    }

    function handleSuccess(code) {
      if (code === lastCode) return;
      lastCode = code;

      if (navigator.vibrate) navigator.vibrate(80);

      skuVal.textContent = code;
      const data = mockDB[code] || {
        name: "Unknown SKU (New Item)",
        locations: [{ code: "RECEIVING", qty: 0 }]
      };

      productName.textContent = data.name;
      renderLocations(data.locations);
      inventoryPanel.style.display = 'block';
    }

    function renderLocations(locations) {
      locationsList.innerHTML = locations.map(loc => `
        <div class="location-row">
          <div>
            <strong style="color:#f8fafc;">${loc.code}</strong>
            <span style="color:#94a3b8; font-size:0.85rem; margin-left:8px;">Qty: ${loc.qty}</span>
          </div>
          <div class="btn-group">
            <button class="btn-sm btn-add" onclick="alert('Added stock to ${loc.code}')">+</button>
            <button class="btn-sm btn-pull" onclick="alert('Pulled stock from ${loc.code}')">-</button>
            <button class="btn-sm btn-move" onclick="alert('Move ${loc.code} location')">Move</button>
          </div>
        </div>
      `).join('');
    }

    function stopCamera() {
      isScanning = false;
      if (animFrameId) cancelAnimationFrame(animFrameId);
      if (codeReader) codeReader.reset();
      
      if (nativeStream) {
        nativeStream.getTracks().forEach(track => track.stop());
        video.srcObject = null;
        nativeStream = null;
      }
      toggleBtn.textContent = 'Start Camera';
    }

    toggleBtn.addEventListener('click', async () => {
      if (isScanning) {
        stopCamera();
      } else {
        try {
          isScanning = true;
          toggleBtn.textContent = 'Stop Camera';
          lastCode = null;
          await startCamera();
        } catch (err) {
          alert('Could not start camera: ' + err.message);
          stopCamera();
        }
      }
    });

    window.addEventListener('load', initScanner);
  </script>
</body>
</html>
