<!DOCTYPE html>
<html>
<body>
  <button id="btn">Test Camera Permission</button>
  <video id="vid" autoplay playsinline style="width:300px;"></video>

  <script>
    document.getElementById('btn').addEventListener('click', async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        document.getElementById('vid').srcObject = stream;
        alert('Camera hardware connected successfully!');
      } catch (err) {
        alert('BLOCKED: ' + err.name + ' - ' + err.message);
      }
    });
  </script>
</body>
</html>
