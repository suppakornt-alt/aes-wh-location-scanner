<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barcode & QR Scanner</title>
  <script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.0/umd/index.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; text-align: center; margin: 0; padding: 1.5rem; background: #f8fafc; color: #1e293b; }
    .scanner { position: relative; max-width: 480px; margin: 1rem auto; border-radius: 12px; overflow: hidden; background: #000; }
    video { width: 100%; height: 320px; object-fit: cover; display: block; }
    .overlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 80%; height: 40%; border: 2px dashed rgba(255,255,255,.85); border-radius: 8px; pointer-events: none; }
    .card { max-width: 480px; margin: 1rem auto; padding: 1rem; background: #fff; border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,.08); text-align: left; }
    #result { font-size: 1.6rem; font-weight: 700; color: #0284c7; word-break: break-all; margin: .5rem 0; }
    button { padding: 10px 24px; font-size: 1rem; font-weight: 600; color: #fff; background: #0284c7; border: 0; border-radius: 8px; cursor: pointer; }
    #copy-btn { background: #64748b; padding: 6px 14px; font-size: .9rem; }
    #status { color: #64748b; font-size: .9rem; min-height: 1.2rem; margin-top: .5rem; }
    #warn { color: #b91c1c; font-size: .95rem; margin: .5rem auto; max-width: 480px; }

    /* Inventory Locations Styling */
    .location-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #e2e8f0;
    }
    .btn-group { display: flex; gap: 6px; }
    .btn-action {
      padding: 6px 12px;
      font-size: 0.85rem;
      border-radius: 6px;
      border: none;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-add { background: #16a34a; }
    .btn-pull { background: #dc2626; }
    .btn-move { background: #d97706; }
  </style>
</head>
<body>
  <h2>Scan Barcode & QR Code</h2>
  <div id="warn"></div>
  <button id="toggle-btn">Start Camera</button>
  <div id="status"></div>

  <div class="scanner">
    <video id="video" playsinline muted></video>
    <div class="overlay"></div>
  </div>

  <div class="card">
    <strong>Scanned Lot Number:</strong>
    <div id="result">Waiting to scan...</div>
    <div style="color:#64748b;font-size:.9rem">Format: <span id="format">-</span></div>
    <button id="copy-btn" style="margin-top:.6rem">Copy</button>
  </div>

  <!-- Inventory Lookup Card -->
  <div class="card" id="inventory-card" style="display: none;">
    <div style="font-size: 0.8rem; color: #64748b; font-weight: 600;">PRODUCT DETAILS</div>
    <div id="product-name" style="font-size: 1.1rem; font-weight: 700; margin-bottom: 1rem; color: #0f172a;">-</div>

    <div style="font-size: 0.8rem; color: #64748b; font-weight: 600; margin-bottom: 0.5rem;">LOCATIONS & STOCK</div>
    <div id="locations-list"></div>
  </div>

  <script>
    const video = document.getElementById('video');
    const toggleBtn = document.getElementById('toggle-btn');
    const statusEl = document.getElementById('status');
    const resultEl = document.getElementById('result');
    const formatEl = document.getElementById('format');
    const warnEl = document.getElementById('warn');
    const inventoryCard = document.getElementById('inventory-card');
    const productName = document.getElementById('product-name');
    const locationsList = document.getElementById('locations-list');

    let stream = null;
    let running = false;
    let timerId = null;

    // Buffer for 5-sample consensus verification
    let sampleBuffer = [];
    const REQUIRED_SAMPLES = 5;

    // Regular Expression for exactly 7 numeric digits
    const LOT_PATTERN = /^\d{7}$/;

    // Mock Database Lookup Table
    const mockDB = {
      "2606053": {
        name: "Industrial Bearing Pack 10mm (Lot #2606053)",
        locations: [
          { code: "A-01-02", qty: 45 },
          { code: "B-04-12", qty: 12 }
        ]
      }
    };

    // Warn if opened inside an app that blocks the camera
    if (/Line\/|FBAN|FBAV|Instagram|MicroMessenger/i.test(navigator.userAgent)) {
      warnEl.textContent = 'This looks like an in-app browser (LINE/Facebook/etc). Camera may be blocked. Please open this link in Chrome or Safari.';
    }

    // Process raw scan and enforce 7-digit lot number rule
    function processRawScan(code, format) {
      const cleanCode = code.trim();

      // Enforce strict 7-digit numeric pattern match
      if (!LOT_PATTERN.test(cleanCode)) {
        statusEl.textContent = 'Ignoring invalid format (Must be 7 digits)';
        return; // Ignore and continue scanning next frame
      }

      sampleBuffer.push({ code: cleanCode, format });
      statusEl.textContent = `Verifying Lot Number... (${sampleBuffer.length}/${REQUIRED_SAMPLES})`;

      if (sampleBuffer.length >= REQUIRED_SAMPLES) {
        // Calculate the most frequent code (mode)
        const frequency = {};
        let maxCount = 0;
        let winner = sampleBuffer[0];

        for (const item of sampleBuffer) {
          frequency[item.code] = (frequency[item.code] || 0) + 1;
          if (frequency[item.code] > maxCount) {
            maxCount = frequency[item.code];
            winner = item;
          }
        }

        // Final confirmed result
        onCodeConfirmed(winner.code, winner.format);
        sampleBuffer = []; // Reset sample buffer
      }
    }

    // Called once 5-sample consensus is verified
    function onCodeConfirmed(code, format) {
      resultEl.textContent = code;
      formatEl.textContent = format;
      statusEl.textContent = 'Verified 7-Digit Lot Number!';
      if (navigator.vibrate) navigator.vibrate(100);

      handleInventoryLookup(code);
    }

    function handleInventoryLookup(code) {
      const data = mockDB[code] || {
        name: `Lot #${code} (New SKU)`,
        locations: [{ code: "RECEIVING-BAY", qty: 0 }]
      };

      productName.textContent = data.name;
      renderLocations(data.locations);
      inventoryCard.style.display = 'block';
    }

    function renderLocations(locations) {
      locationsList.innerHTML = locations.map(loc => `
        <div class="location-row">
          <div>
            <strong style="color: #1e293b;">${loc.code}</strong>
            <span style="color: #64748b; font-size: 0.9rem; margin-left: 8px;">Qty: ${loc.qty}</span>
          </div>
          <div class="btn-group">
            <button class="btn-action btn-add" onclick="alert('Added stock to ${loc.code}')">+</button>
            <button class="btn-action btn-pull" onclick="alert('Pulled stock from ${loc.code}')">-</button>
            <button class="btn-action btn-move" onclick="alert('Moving stock from ${loc.code}')">Move</button>
          </div>
        </div>
      `).join('');
    }

    async function openCamera() {
      const attempts = [
        { video: { facingMode: { ideal: 'environment' } }, audio: false },
        { video: { facingMode: 'environment' }, audio: false },
        { video: true, audio: false }
      ];

      let lastError = null;

      for (const constraints of attempts) {
        try {
          return await navigator.mediaDevices.getUserMedia(constraints);
        } catch (err) {
          lastError = err;
          if (err.name === 'NotAllowedError') throw err;
        }
      }

      try {
        const devices = await navigator.mediaDevices.enumerateDevices();
        const cameras = devices.filter(d => d.kind === 'videoinput').reverse();
        for (const cam of cameras) {
          try {
            return await navigator.mediaDevices.getUserMedia({
              video: { deviceId: { exact: cam.deviceId } },
              audio: false
            });
          } catch (err) {
            lastError = err;
          }
        }
      } catch (err) {
        lastError = err;
      }

      throw lastError;
    }

    async function start() {
      if (!window.isSecureContext || !navigator.mediaDevices?.getUserMedia) {
        statusEl.textContent = 'Camera needs HTTPS. Open the https:// github.io link, not a file.';
        return;
      }
      try {
        stop();
        statusEl.textContent = 'Opening camera...';
        sampleBuffer = [];

        stream = await openCamera();
        video.srcObject = stream;
        await video.play();

        running = true;
        toggleBtn.textContent = 'Stop Camera';
        statusEl.textContent = 'Point at 7-digit Lot barcode...';

        if ('BarcodeDetector' in window) {
          startNativeLoop();
        } else {
          startZxingLoop();
        }
      } catch (err) {
        statusEl.textContent = 'Camera error: ' + err.name + ' - ' + err.message;
        stop();
      }
    }

    function stop() {
      running = false;
      clearTimeout(timerId);
      sampleBuffer = [];
      if (stream) {
        stream.getTracks().forEach(t => t.stop());
        stream = null;
      }
      video.srcObject = null;
      toggleBtn.textContent = 'Start Camera';
    }

    function startNativeLoop() {
      const detector = new BarcodeDetector();
      const tick = async () => {
        if (!running) return;
        try {
          const found = await detector.detect(video);
          if (found.length > 0) processRawScan(found[0].rawValue, found[0].format);
        } catch (e) {}
        timerId = setTimeout(tick, 80);
      };
      tick();
    }

    function startZxingLoop() {
      const hints = new Map();
      hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [
        ZXing.BarcodeFormat.EAN_13, ZXing.BarcodeFormat.EAN_8,
        ZXing.BarcodeFormat.UPC_A, ZXing.BarcodeFormat.UPC_E,
        ZXing.BarcodeFormat.CODE_128, ZXing.BarcodeFormat.CODE_39,
        ZXing.BarcodeFormat.ITF, ZXing.BarcodeFormat.QR_CODE
      ]);
      hints.set(ZXing.DecodeHintType.TRY_HARDER, true);

      const reader = new ZXing.MultiFormatReader();
      reader.setHints(hints);

      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d', { willReadFrequently: true });

      const tick = () => {
        if (!running) return;
        if (video.videoWidth > 0) {
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          try {
            const source = new ZXing.HTMLCanvasElementLuminanceSource(canvas);
            const bitmap = new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(source));
            const result = reader.decode(bitmap);
            processRawScan(result.getText(), ZXing.BarcodeFormat[result.getBarcodeFormat()]);
          } catch (e) {}
        }
        timerId = setTimeout(tick, 100);
      };
      tick();
    }

    toggleBtn.addEventListener('click', () => (running ? stop() : start()));

    document.getElementById('copy-btn').addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(resultEl.textContent);
        statusEl.textContent = 'Copied';
      } catch {
        statusEl.textContent = 'Copy not allowed here';
      }
    });
  </script>
</body>
</html>
