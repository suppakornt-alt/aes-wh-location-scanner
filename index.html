<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barcode & QR Scanner</title>
  <script src="https://unpkg.com/@zxing/library@latest"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      text-align: center;
      margin: 0;
      padding: 1.5rem;
      background: #f8fafc;
      color: #1e293b;
    }
    .scanner-container {
      position: relative;
      max-width: 480px;
      margin: 1rem auto;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
      min-height: 280px;
    }
    video {
      width: 100%;
      height: 320px;
      object-fit: contain;
      display: block;
    }
    .overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 75%;
      height: 45%;
      border: 2px dashed rgba(255, 255, 255, 0.85);
      border-radius: 8px;
      pointer-events: none;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.3);
    }
    .card {
      max-width: 480px;
      margin: 1rem auto;
      padding: 1rem;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      text-align: left;
    }
    .result-value {
      font-size: 1.25rem;
      font-weight: 700;
      color: #0284c7;
      word-break: break-all;
    }
    button {
      padding: 10px 24px;
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      background: #0284c7;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    button:active { background: #0369a1; }
  </style>
</head>
<body>

  <h2>Scan Barcode & QR Code</h2>
  <button id="toggle-btn">Start Camera</button>

  <div class="scanner-container">
    <video id="video" autoplay playsinline muted></video>
    <div class="overlay"></div>
  </div>

  <div class="card">
    <div><strong>Scanned Data:</strong></div>
    <div class="result-value" id="result-text">Waiting to scan...</div>
    <div style="margin-top: 0.5rem; color: #64748b; font-size: 0.9rem;">
      Format: <span id="result-format">-</span>
    </div>
  </div>

  <script>
    let codeReader = null;
    let isScanning = false;

    const resultText = document.getElementById('result-text');
    const resultFormat = document.getElementById('result-format');
    const toggleBtn = document.getElementById('toggle-btn');

    // Initialize ZXing Reader with fallback format hints
    function initZXing() {
      const hints = new Map();
      const formats = [
        ZXing.BarcodeFormat.QR_CODE,
        ZXing.BarcodeFormat.EAN_13,
        ZXing.BarcodeFormat.EAN_8,
        ZXing.BarcodeFormat.CODE_128,
        ZXing.BarcodeFormat.CODE_39,
        ZXing.BarcodeFormat.UPC_A,
        ZXing.BarcodeFormat.UPC_E,
        ZXing.BarcodeFormat.ITF
      ];
      hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, formats);
      hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
      
      codeReader = new ZXing.BrowserMultiFormatReader(hints);
    }

    toggleBtn.addEventListener('click', async () => {
      if (!codeReader) initZXing();

      if (isScanning) {
        codeReader.reset();
        isScanning = false;
        toggleBtn.textContent = 'Start Camera';
        return;
      }

      try {
        isScanning = true;
        toggleBtn.textContent = 'Stop Camera';
        resultText.textContent = 'Scanning...';
        resultFormat.textContent = '-';

        // Safe constraints that WILL NOT crash your camera hardware
        const constraints = {
          video: {
            facingMode: { ideal: 'environment' }
          }
        };

        await codeReader.decodeFromConstraints(
          constraints,
          'video',
          (result, err) => {
            if (result) {
              resultText.textContent = result.getText();
              resultFormat.textContent = result.getBarcodeFormat();
              if (navigator.vibrate) navigator.vibrate(100);
            }
          }
        );
      } catch (err) {
        alert('Could not start camera: ' + err.message);
        isScanning = false;
        toggleBtn.textContent = 'Start Camera';
      }
    });

    window.addEventListener('load', initZXing);
  </script>
</body>
</html>
