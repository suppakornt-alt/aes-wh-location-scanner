<!DOCTYPE html>
<html lang="th" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AES's Warehouse · ทีมออฟฟิศโกดัง</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

  <svg width="0" height="0" class="svg-sprite" aria-hidden="true">
    <defs>
      <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
      <symbol id="i-cube" viewBox="0 0 24 24"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3zM12 12l8-4.5M12 12v9M12 12L4 7.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/></symbol>
      <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
      <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
      <symbol id="i-swap" viewBox="0 0 24 24"><path d="M7 7h12l-3-3M17 17H5l3 3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-theme" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 4a8 8 0 000 16z" fill="currentColor"/></symbol>
      <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M4 20c1-4 4.5-6 8-6s7 2 8 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 7.5V12l3 2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 10-2.3 5.7M20 5v6h-6" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M16 16l4 4" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></symbol>
    </defs>
  </svg>

  <div id="scrim"></div>

  <aside id="sidebar" aria-label="เมนูหลัก">
    <div class="sb-head">
      <div class="brand">
        <span class="brand-mark"><svg class="ic"><use href="#i-cube"/></svg></span>
        <div>
          <div class="brand-name">AES Warehouse</div>
          <div class="brand-sub">ทีมออฟฟิศโกดัง</div>
        </div>
      </div>
      <button type="button" class="icon-btn sb-close" id="btn-close-sidebar" aria-label="ปิดเมนู"><svg class="ic"><use href="#i-close"/></svg></button>
    </div>
    <div class="sb-scroll">
      <div class="sb-label">ทีม</div>
      <nav class="sb-nav">
        <a class="nav-item" href="../index.html">
          <svg class="ic"><use href="#i-swap"/></svg><span>เปลี่ยนทีม</span>
        </a>
      </nav>
      <div class="sb-label">เมนู</div>
      <nav class="sb-nav">
        <button type="button" class="nav-item active" data-view="orders">
          <svg class="ic"><use href="#i-list"/></svg><span>เบิกสินค้าตาม ORD</span>
        </button>
        <button type="button" class="nav-item" data-view="pending">
          <svg class="ic"><use href="#i-clock"/></svg><span>รอตัดสต็อก</span>
          <span class="of-nav-count" id="pending-count" hidden>0</span>
        </button>
      </nav>
    </div>
    <div class="sb-foot">
      <div class="sb-user"><svg class="ic ic-sm"><use href="#i-user"/></svg><span id="sidebar-user">...</span></div>
      <button type="button" class="icon-btn" id="btn-theme" title="สลับโหมดสว่าง/มืด"><svg class="ic"><use href="#i-theme"/></svg></button>
    </div>
  </aside>

  <div id="main">
    <header id="topbar">
      <button type="button" class="icon-btn menu-btn" id="btn-open-sidebar" aria-label="เปิดเมนู">
        <svg class="ic"><use href="#i-menu"/></svg>
      </button>
      <h1 id="page-title">เบิกสินค้าตาม ORD</h1>
    </header>

    <div id="views">

      <!-- ===== View 1: ORD list + allocation screen ===== -->
      <div id="view-orders" class="app-view scroll-view">
        <div class="page-wrap of-wrap">

          <!-- 1a. ORDs waiting for location allocation -->
          <section id="orders-panel" class="of-panel">
            <div class="of-toolbar">
              <div class="of-search">
                <svg class="ic ic-sm"><use href="#i-search"/></svg>
                <input type="search" id="ord-search" class="of-input" placeholder="ค้นหา ORD / ลูกค้า / รหัสสินค้า" autocomplete="off" />
              </div>
              <button type="button" class="btn btn-outline" id="btn-refresh-orders">
                <svg class="ic ic-sm"><use href="#i-refresh"/></svg><span>โหลดใหม่</span>
              </button>
            </div>
            <div class="of-hint" id="orders-summary">กำลังโหลด ORD...</div>
            <div id="ord-list" class="of-card-list"></div>
          </section>

          <!-- 1b. Allocation screen for one full ORD -->
          <section id="alloc-panel" class="of-panel" hidden>
            <button type="button" class="btn btn-ghost btn-sm of-back" id="btn-back-orders">
              <svg class="ic ic-sm"><use href="#i-back"/></svg><span>กลับไปรายการ ORD</span>
            </button>

            <div class="type-group-block of-ord-head">
              <div class="of-ord-title" id="alloc-ord-id">-</div>
              <div class="of-ord-meta" id="alloc-ord-meta">-</div>
            </div>

            <div id="alloc-skus" class="of-card-list"></div>

            <div class="of-savebar">
              <div class="of-summary" id="alloc-summary">-</div>
              <button type="button" class="btn btn-primary of-save-btn" id="btn-submit-alloc" disabled>ยืนยันการเบิก</button>
            </div>
          </section>

        </div>
      </div>

      <!-- ===== View 2: PENDING ORDs waiting for the timed stock deduction ===== -->
      <div id="view-pending" class="app-view scroll-view" hidden>
        <div class="page-wrap of-wrap">
          <div class="of-toolbar">
            <div class="of-hint" id="pending-summary">กำลังโหลด...</div>
            <button type="button" class="btn btn-outline" id="btn-refresh-pending">
              <svg class="ic ic-sm"><use href="#i-refresh"/></svg><span>โหลดใหม่</span>
            </button>
          </div>
          <div id="pending-list" class="of-card-list"></div>
        </div>
      </div>

    </div>
  </div>

  <!-- ===== Modal: add a new location for the SKU (same fields as the picker page) ===== -->
  <div id="modal-add-loc" class="modal-overlay" hidden>
    <div class="modal-card">
      <div class="modal-head">
        <div>
          <h3>เพิ่มพิกัดสินค้าใหม่</h3>
          <span class="user-badge" id="add-loc-sku">-</span>
        </div>
        <button type="button" class="icon-btn" id="btn-add-loc-close" aria-label="ปิด">
          <svg class="ic"><use href="#i-close"/></svg>
        </button>
      </div>

      <div class="modal-body">
        <div class="of-modal-product" id="add-loc-name">-</div>

        <label for="add-loc-lot">Lot Number (ถ้ามี)</label>
        <input type="tel" id="add-loc-lot" maxlength="20" inputmode="numeric" pattern="[0-9]*" placeholder="กรอกตัวเลข Lot" autocomplete="off" />

        <div class="field-grid">
          <div>
            <label for="add-loc-col-start">เสา/แถว เริ่มต้น</label>
            <div class="coord-picker-grid">
              <select id="add-loc-col-start"></select>
              <select id="add-loc-row-start" aria-label="แถวเริ่มต้น"></select>
            </div>
          </div>
          <div>
            <label for="add-loc-col-end">เสา/แถว สิ้นสุด</label>
            <div class="coord-picker-grid">
              <select id="add-loc-col-end"></select>
              <select id="add-loc-row-end" aria-label="แถวสิ้นสุด"></select>
            </div>
          </div>
        </div>

        <label>ชั้นวาง (เลือกได้มากกว่า 1 ชั้น)</label>
        <div class="level-btn-row" id="add-loc-levels"></div>

        <label for="add-loc-qty">จำนวนที่จัดเก็บ</label>
        <input type="tel" id="add-loc-qty" inputmode="numeric" pattern="[0-9]*" placeholder="0" autocomplete="off" />
      </div>

      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="btn-add-loc-cancel">ยกเลิก</button>
        <button type="button" class="btn btn-primary" id="btn-add-loc-save">บันทึกพิกัดใหม่</button>
      </div>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/office.js"></script>
</body>
</html>
